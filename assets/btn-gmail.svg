<svg xmlns="http://www.w3.org/2000/svg" width="100" height="46" viewBox="0 0 100 46" role="img" aria-label="EMAIL">
  <title>EMAIL</title>
  <defs>
    <linearGradient id="bt-ir" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="100" y2="0">
      <stop offset="0%" stop-color="#0A4591">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#0A4591;#006EB4;#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591"/>
      </stop>
      <stop offset="33%" stop-color="#006EB4">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#006EB4;#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4"/>
      </stop>
      <stop offset="66%" stop-color="#4FA3C7">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4;#4FA3C7"/>
      </stop>
      <stop offset="100%" stop-color="#85C7C6">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4;#4FA3C7;#85C7C6"/>
      </stop>
    </linearGradient>

    <filter id="bt-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1.5" y="1.5" width="97" height="43" rx="21"
        fill="#000000" stroke="url(#bt-ir)" stroke-width="2"/>

  <rect x="1.5" y="1.5" width="97" height="43" rx="21"
        fill="url(#bt-ir)" fill-opacity="0.10"/>

  <text x="50" y="28" text-anchor="middle" filter="url(#bt-glow)"
        font-family="'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif"
        font-size="15" font-weight="700" letter-spacing="2"
        fill="url(#bt-ir)">EMAIL</text>
</svg>
