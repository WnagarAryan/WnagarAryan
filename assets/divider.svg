<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="34" viewBox="0 0 1000 34" role="img" aria-label="divider">
  <title>binary divider</title>
  <defs>
    <!-- every digit shares this one gradient, so the bright band travelling
         through it sweeps the whole row rather than each glyph separately -->
    <linearGradient id="dv-sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1000" y2="0">
      <stop offset="0%" stop-color="#0A4591">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#0A4591;#006EB4;#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591"/>
      </stop>
      <stop offset="33%" stop-color="#006EB4">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#006EB4;#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4"/>
      </stop>
      <stop offset="66%" stop-color="#4FA3C7">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#4FA3C7;#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4;#4FA3C7"/>
      </stop>
      <stop offset="100%" stop-color="#85C7C6">
        <animate attributeName="stop-color" dur="14s" repeatCount="indefinite" values="#85C7C6;#C7B29D;#6C4933;#0A4591;#006EB4;#4FA3C7;#85C7C6"/>
      </stop>
    </linearGradient>

    <linearGradient id="dv-fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0"/>
      <stop offset="12%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="88%"  stop-color="#fff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="dv-mask"><rect width="1000" height="34" fill="url(#dv-fade)"/></mask>

    <filter id="dv-glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="2.3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      .dv-d {
        font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;
        font-size:16px; font-weight:700; text-anchor:middle;
        fill:url(#dv-sweep);
      }
      /* steps(1) so a digit snaps between states instead of dissolving */
      @keyframes dv-on  { 0%,49.9%{ opacity:1 } 50%,100%{ opacity:0 } }
      @keyframes dv-off { 0%,49.9%{ opacity:0 } 50%,100%{ opacity:1 } }
      #dv-a0 { animation: dv-on  2.30s steps(1,end) infinite -0.00s; }
      #dv-b0 { animation: dv-off 2.30s steps(1,end) infinite -0.00s; }
      #dv-a1 { animation: dv-on  3.07s steps(1,end) infinite -2.21s; }
      #dv-b1 { animation: dv-off 3.07s steps(1,end) infinite -2.21s; }
