<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-label="Terminal header">
  <title>profile boot sequence</title>
  <defs>
    <linearGradient id="tb-scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#e8e2d4" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#e8e2d4" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#e8e2d4" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="tb-bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#6b6255"/>
      <stop offset="50%"  stop-color="#e8e2d4"/>
      <stop offset="100%" stop-color="#8a7f70"/>
    </linearGradient>

    <clipPath id="tb-card"><rect x="1" y="1" width="998" height="278" rx="18"/></clipPath>

    <clipPath id="tb-c1"><rect x="46" y="86"  width="0" height="26">
      <animate attributeName="width" values="0;0;214;214;214" keyTimes="0;0.033;0.167;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tb-c2"><rect x="46" y="122" width="0" height="26">
      <animate attributeName="width" values="0;0;226;226;226" keyTimes="0;0.189;0.344;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tb-c3"><rect x="46" y="158" width="0" height="26">
      <animate attributeName="width" values="0;0;498;498;498" keyTimes="0;0.367;0.589;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="tb-c4"><rect x="46" y="194" width="0" height="26">
      <animate attributeName="width" values="0;0;172;172;172" keyTimes="0;0.611;0.722;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect></clipPath>

    <style>
      .tb-mono { font-family: 'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,'Courier New',monospace; }
      .tb-prompt { fill:#d8c9b4; }
      .tb-key    { fill:#a9b2c0; }
      .tb-val    { fill:#f2efe8; }
      .tb-dim    { fill:#7b8494; }

      @keyframes tb-sweep { 0%{ transform:translateX(-1100px) } 100%{ transform:translateX(1100px) } }
      @keyframes tb-blink { 0%,49%{ opacity:1 } 50%,100%{ opacity:0 } }
      @keyframes tb-flick { 0%,100%{ opacity:.5 } 50%{ opacity:1 } }
      @keyframes tb-roll  { 0%,100%{ transform:translate(0,0) scale(1.06) } 50%{ transform:translate(-18px,6px) scale(1.06) } }

      #tb-sweep1 { animation: tb-sweep 6s linear infinite; }
      #tb-cursor { animation: tb-blink 1s step-end infinite; }
      #tb-led    { animation: tb-flick 2.4s ease-in-out infinite; }
      #tb-sky    { animation: tb-roll 26s ease-in-out infinite; transform-origin:500px 140px; }
    </style>
  </defs>

  <g clip-path="url(#tb-card)">
    <rect width="1000" height="280" fill="#0a0a0c"/>
    <image id="tb-sky" x="0" y="0" width="1000" height="280"
           href="data:image/jpeg;base64,"/>
    <rect width="1000" height="280" fill="#07080a" fill-opacity="0.55"/>

    <rect id="tb-sweep1" x="-200" y="0" width="200" height="280" fill="url(#tb-scan)"/>

    <rect x="0" y="0" width="1000" height="44" fill="#05060a" fill-opacity="0.82"/>
    <line x1="0" y1="44" x2="1000" y2="44" stroke="#e8e2d4" stroke-opacity="0.18"/>
    <circle cx="28" cy="22" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="22" r="6" fill="#febc2e"/>
    <circle cx="72" cy="22" r="6" fill="#28c840"/>
    <text class="tb-mono tb-dim" x="500" y="27" font-size="13" text-anchor="middle">~/github/WnagarAryan &#8212; zsh</text>
    <circle id="tb-led" cx="964" cy="22" r="4" fill="#d8c9b4"/>

    <g id="tb-lines" font-size="19" class="tb-mono">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.94;0.985;1" dur="9s" repeatCount="indefinite"/>

      <g clip-path="url(#tb-c1)">
        <text x="46" y="105"><tspan class="tb-prompt">&gt;</tspan><tspan class="tb-val" dx="10">booting profile...</tspan></text>
      </g>
      <g clip-path="url(#tb-c2)">
        <text x="46" y="141"><tspan class="tb-prompt">&gt;</tspan><tspan class="tb-key" dx="10">user&#160;&#160;</tspan><tspan class="tb-dim">: </tspan><tspan class="tb-val">Aryan Nagar</tspan></text>
      </g>
      <g clip-path="url(#tb-c3)">
        <text x="46" y="177"><tspan class="tb-prompt">&gt;</tspan><tspan class="tb-key" dx="10">role&#160;&#160;</tspan><tspan class="tb-dim">: </tspan><tspan class="tb-val">AI System Architect | ML &amp; Agentic AI</tspan></text>
      </g>
      <g clip-path="url(#tb-c4)">
        <text x="46" y="213"><tspan class="tb-prompt">&gt;</tspan><tspan class="tb-key" dx="10">status</tspan><tspan class="tb-dim">: </tspan><tspan class="tb-val">online</tspan></text>
      </g>

      <rect id="tb-cursor" x="46" y="196" width="11" height="22" fill="#d8c9b4">
        <animate attributeName="x"
          values="46;46;256;256;46;268;268;46;540;540;46;214;214;214"
          keyTimes="0;0.033;0.167;0.185;0.189;0.344;0.363;0.367;0.589;0.607;0.611;0.722;0.94;1"
          dur="9s" repeatCount="indefinite"/>
        <animate attributeName="y"
          values="88;88;88;88;124;124;124;160;160;160;196;196;196;196"
          keyTimes="0;0.033;0.167;0.185;0.189;0.344;0.363;0.367;0.589;0.607;0.611;0.722;0.94;1"
          dur="9s" repeatCount="indefinite"/>
      </rect>
    </g>

    <rect x="46" y="246" width="908" height="4" rx="2" fill="#e8e2d4" fill-opacity="0.14"/>
    <rect x="46" y="246" width="0" height="4" rx="2" fill="url(#tb-bar)">
      <animate attributeName="width" values="0;0;908;908;0" keyTimes="0;0.033;0.722;0.94;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <g stroke="#d8c9b4" stroke-opacity="0.42" stroke-width="2" fill="none">
      <path d="M16 68V56h12"/><path d="M984 68V56h-12"/>
      <path d="M16 212v12h12"/><path d="M984 212v12h-12"/>
    </g>
  </g>
  <rect x="1" y="1" width="998" height="278" rx="18" fill="none" stroke="#e8e2d4" stroke-opacity="0.22"/>
</svg>
