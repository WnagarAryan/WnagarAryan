<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230" role="img" aria-label="Kuberis">
  <title>Kuberis</title>
  <defs>
    <clipPath id="kb-clip"><rect width="520" height="230" rx="16"/></clipPath>
    <style>
      @font-face {
        font-family:'KBSerif'; font-style:normal; font-weight:700;
        src:url(data:font/woff;base64,) format('woff');
      }
      .kb-serif { font-family:'KBSerif','Playfair Display',Georgia,'Times New Roman',serif; }
      .kb-mono  { font-family:'Courier New',Consolas,monospace; letter-spacing:1.4px; }

      /* a ruled ledger should sit still - the only motion is the rule being
         drawn under the wordmark, and the caret at the end of the line */
      @keyframes kb-draw  { 0%{ stroke-dashoffset:250 } 55%,100%{ stroke-dashoffset:0 } }
      @keyframes kb-blink { 0%,49%{ opacity:1 } 50%,100%{ opacity:0 } }

      #kb-rule { stroke-dasharray:250; animation: kb-draw 7s ease-in-out infinite; }
      #kb-cur  { animation: kb-blink 1.1s step-end infinite; }
    </style>
  </defs>

  <g clip-path="url(#kb-clip)">
    <rect width="520" height="230" fill="#e4ddcf"/>

    <g stroke="#d6cdb9" stroke-width="1">
      <line x1="0" y1="26" x2="520" y2="26"/>
      <line x1="0" y1="52" x2="520" y2="52"/>
      <line x1="0" y1="78" x2="520" y2="78"/>
      <line x1="0" y1="104" x2="520" y2="104"/>
      <line x1="0" y1="130" x2="520" y2="130"/>
      <line x1="0" y1="156" x2="520" y2="156"/>
      <line x1="0" y1="182" x2="520" y2="182"/>
      <line x1="0" y1="208" x2="520" y2="208"/>
    </g>

    <g class="kb-mono" font-size="9.5" fill="#a9832f">
      <text x="20" y="26">01 &#8212; NEW ENTRY</text>
      <text x="500" y="26" text-anchor="end">READS CSV / EXCEL</text>
      <text x="20" y="210">PANDAS &#183; LANGCHAIN &#183; GROQ</text>
    </g>
    <text class="kb-mono" x="500" y="210" text-anchor="end" font-size="9.5" fill="#8c8474">v1.0</text>

    <text class="kb-serif" x="260" y="128" text-anchor="middle" font-size="42" font-weight="700"
          fill="#14293e">&#167; Kuberis</text>

    <line id="kb-rule" x1="135" y1="144" x2="385" y2="144" stroke="#14293e" stroke-width="1.5" stroke-opacity="0.55"/>

    <text class="kb-mono" x="260" y="170" text-anchor="middle" font-size="9" fill="#a9832f">
      AI BUSINESS INTELLIGENCE &#183; READ THE NUMBERS, ASK THE QUESTIONS
    </text>
    <rect id="kb-cur" x="474" y="120" width="3" height="14" fill="#a9832f"/>
  </g>
  <rect x="0.75" y="0.75" width="518.5" height="228.5" rx="15.25" fill="none" stroke="#c9bfa8" stroke-width="1.5"/>
</svg>
